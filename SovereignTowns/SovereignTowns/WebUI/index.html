              `Spec metadata load failed ${r.status}: ${r.body?.message || '?'}`), 'err');
          }
        },

        async loadFinance() {
          // Mirrors loadConfig/loadSettlements: uses the shared http() helper (X-ST-Token header).
          // Soft-fail: never throw out of the 5s interval; surface a banner via financeError instead.
          try {
            const r = await this.http('GET', '/api/finance');
            if (r.ok) {
              this.finance = r.body;
              this.financeError = '';
            } else {
              this.financeError = this.tr(
                `加载失败 HTTP ${r.status}: ${r.body?.message || '?'}`,
                `Load failed, HTTP ${r.status}: ${r.body?.message || '?'}`);
            }
          } catch (e) {
            this.financeError = this.tr('加载失败：', 'Load failed: ') + (e?.message || String(e));
          }
        },

        // loadAssessment：拉取手动驻军目标评估（仅手动模式有数据）。并入 5 秒轮询。
        async loadAssessment() {
          try {
            const r = await this.http('GET', '/api/assessment');
            if (r.ok) {
              this.assessment = r.body;
              this.assessmentError = '';
            } else {
              this.assessmentError = this.tr(
                `加载失败 HTTP ${r.status}: ${r.body?.message || '?'}`,
                `Load failed, HTTP ${r.status}: ${r.body?.message || '?'}`);
            }
          } catch (e) {
            this.assessmentError = this.tr('加载失败：', 'Load failed: ') + (e?.message || String(e));
          }
        },

        // loadActivity：拉取运行动态（今日概况 + 近期动态流）。与 loadFinance 同样并入 5 秒轮询。
        async loadActivity() {
          try {
            const r = await this.http('GET', '/api/activity');
            if (r.ok) {
              this.activity = r.body;
              this.activityError = '';
            } else {
              this.activityError = this.tr(
                `加载失败 HTTP ${r.status}: ${r.body?.message || '?'}`,
                `Load failed, HTTP ${r.status}: ${r.body?.message || '?'}`);
            }
          } catch (e) {
            this.activityError = this.tr('加载失败：', 'Load failed: ') + (e?.message || String(e));
          }
        },

        async save() {
          if (!this.config) return;
          this.saving = true;
          this.warning = '';
          const r = await this.http('PUT', '/api/config', this.config);
          this.saving = false;
          if (r.ok) {
            this.dirty = false;
            this.showSuccess(this.tr(
              '已保存到游戏。征兵队会立即按新配置重新规划；其他队伍在下一次行动决策时读取新配置。',
              'Saved to the game. Recruiter parties replan immediately under the new config; other parties pick it up at their next action decision.'));
            this.log(this.tr('配置已保存到游戏', 'Configuration saved to the game.'), 'ok');
            await this.fetchStatus();
          } else {
            this.warning = this.tr(
              `保存失败 ${r.status}: ${r.body?.message || '(no message)'}`,
              `Save failed ${r.status}: ${r.body?.message || '(no message)'}`);
            this.log(this.warning, 'err');
          }
        },

        // ============ dirty / 反馈 ============
        // 任何会改动 config 的操作都应调用 markDirty()，让保存按钮、header 状态、关页拦截同步。
        markDirty() { this.dirty = true; },
        showSuccess(msg) {
          this.success = msg;
          if (this._successTimer) clearTimeout(this._successTimer);
          this._successTimer = setTimeout(() => { this.success = ''; }, 6000);
        },
        // 「显示高级参数」切换：若当前所在分组在关闭高级后不可见，回到第一个可见分组。
        toggleAdvanced() {
          this.showAdvanced = !this.showAdvanced;
          const vis = this.visibleSettingsGroups;
          if (!vis.some(g => g.key === this.activeSettingsGroup)) {
            this.activeSettingsGroup = vis[0]?.key || 'targets';
          }
        },

        // ============ toggles ============
        getToggleValue(t) { return !!this.config?.[t.root]?.[t.key]; },
        setToggleValue(t, v) {
          this.config[t.root][t.key] = v;
          this.markDirty();
        },

        // ============ ratio with proportional auto-normalize ============
        // Dragging one slider rescales the other role sliders so Σ stays at 1.0.
        // Edge case: when others are all zero, distribute the remaining evenly.
        adjustRatio(key, raw) {
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) v = 0;
          v = Math.max(0, Math.min(1, v));
          const g = this.config.GlobalDefaults;
          g[key] = v;

          const others = this.ratioKeys.filter(k => k !== key);
          const remaining = 1 - v;
          let otherSum = 0;
          for (const k of others) otherSum += (g[k] || 0);

          if (otherSum > 0.0001) {
            const factor = remaining / otherSum;
            for (const k of others) g[k] = Math.max(0, Math.min(1, g[k] * factor));
          } else {
            const each = Math.max(0, remaining / others.length);
            for (const k of others) g[k] = each;
          }

          // Fix accumulated floating-point drift: snap Σ exactly to 1.0
          // by adjusting the largest "other" entry, never the one user just touched.
          const totalNow = this.ratioKeys.reduce((s, k) => s + g[k], 0);
          const drift = 1 - totalNow;
          if (Math.abs(drift) > 0.0001) {
            let biggest = others[0];
            for (const k of others) if (g[k] > g[biggest]) biggest = k;
            g[biggest] = Math.max(0, Math.min(1, g[biggest] + drift));
          }
          this.markDirty();
        },

        // ============ config value helpers (mixed root) ============
        getConfigValue(s) {
          const root = s.root ? this.config[s.root] : this.config;
          return root?.[s.key];
        },
        setConfigValue(s, raw) {
          const root = s.root ? this.config[s.root] : this.config;
          if (!root) return;
          if (s.type === 'bool') {
            root[s.key] = !!raw;
          } else {
            let v = s.discrete ? parseInt(raw) : parseFloat(raw);
            if (!Number.isFinite(v)) v = s.min ?? 0;
            root[s.key] = v;
          }
          this.markDirty();
        },
        getResourceValue(s) { return this.getConfigValue(s); },
        setResourceValue(s, raw) { this.setConfigValue(s, raw); },

        // ============ 恢复默认 ============
        // spec.def = 出厂默认值。isSpecDefault 用 epsilon 比较（浮点 spec 不能用 ===）。
        isSpecDefault(s) {
          if (!s || s.def === undefined) return true;
          const cur = this.getConfigValue(s);
          if (s.type === 'bool') return !!cur === !!s.def;
          return Math.abs((parseFloat(cur) || 0) - s.def) < 1e-6;
        },
        resetSpec(s) {
          if (!s || s.def === undefined) return;
          const root = s.root ? this.config[s.root] : this.config;
          if (!root) return;
          root[s.key] = s.def;
          this.markDirty();
        },
        // 把当前策略参数分组内所有可见 spec 一次性恢复默认。
        resetGroup() {
          const g = this.activeSettingsGroupData;
          if (!g) return;
          for (const s of g.specs) {
            if (s.def === undefined) continue;
            const root = s.root ? this.config[s.root] : this.config;
            if (root) root[s.key] = s.def;
          }
          this.markDirty();
        },
        // 4 个兵种比例一次性赋默认 —— 直接写值，绕过 adjustRatio 的级联归一化。
        resetRatios() {
          const g = this.config.GlobalDefaults;
          g.CavalryRatio = 0.20; g.HorseArcherRatio = 0.05;
          g.InfantryRatio = 0.50; g.RangedRatio = 0.25;
          this.markDirty();
        },
        ratiosAreDefault() {
          const g = this.config?.GlobalDefaults;
          if (!g) return true;
          return Math.abs((g.CavalryRatio || 0) - 0.20) < 1e-6
              && Math.abs((g.HorseArcherRatio || 0) - 0.05) < 1e-6
              && Math.abs((g.InfantryRatio || 0) - 0.50) < 1e-6
              && Math.abs((g.RangedRatio || 0) - 0.25) < 1e-6;
        },
        resetTier() {
          this.config.GlobalDefaults.MinTier = 2;
          this.config.GlobalDefaults.MaxTier = 5;
          this.markDirty();
        },
        tierIsDefault() {
          const g = this.config?.GlobalDefaults;
          return !!g && g.MinTier === 2 && g.MaxTier === 5;
        },
        resetBranch() {
          this.config.BranchDefaults = this.config.BranchDefaults || {};
          this.config.BranchDefaults.TargetPower = 150;
          this.config.BranchDefaults.LowTierMinFraction = 0.20;
          this.markDirty();
        },

        // ============ ExactTroopTemplate (B7.20: 占比模式 0..1，自动归一化) ============
        // 总和约 = 1.0；新增/删除/调整时按比例 rescale 其他条目让 Σ 保持 1.0。
        // 实际人数 = ratio × TargetTotalCount，由后端计算（前端只显示估算）。
        addTroop(id) {
          const tmpl = this.config.GlobalDefaults.ExactTroopTemplate;
          if (id in tmpl) return;
          // 新条目分得 1/(N+1) 份，其他条目按比例缩 N/(N+1)
          const ids = Object.keys(tmpl);
          const newRatio = ids.length === 0 ? 1.0 : 1.0 / (ids.length + 1);
          const factor = ids.length === 0 ? 0 : (1.0 - newRatio) / Math.max(1e-6, ids.reduce((s, k) => s + (tmpl[k] || 0), 0));
          for (const k of ids) tmpl[k] = Math.max(0, (tmpl[k] || 0) * factor);
          tmpl[id] = newRatio;
          this._snapTroopSumTo1(id);
          this.markDirty();
        },
        updateTroopRatio(id, raw) {
          const tmpl = this.config.GlobalDefaults.ExactTroopTemplate;
          if (!(id in tmpl)) return;
          this.markDirty();
          let v = parseFloat(raw);
          if (!Number.isFinite(v)) v = 0;
          v = Math.max(0, Math.min(1, v));
          tmpl[id] = v;
          // 把剩余 (1 - v) 在其他条目上按原占比 rescale
          const others = Object.keys(tmpl).filter(k => k !== id);
          const remaining = 1 - v;
          let otherSum = 0;
          for (const k of others) otherSum += (tmpl[k] || 0);
          if (others.length === 0) {
            tmpl[id] = 1.0; // 唯一条目强制独占 100%
            return;
          }
          if (otherSum > 1e-6) {
            const factor = remaining / otherSum;
            for (const k of others) tmpl[k] = Math.max(0, (tmpl[k] || 0) * factor);
          } else {
            const each = Math.max(0, remaining / others.length);
            for (const k of others) tmpl[k] = each;
          }
          this._snapTroopSumTo1(id);
        },
        removeTroop(id) {
          const tmpl = this.config.GlobalDefaults.ExactTroopTemplate;
          if (!(id in tmpl)) return;
          this.markDirty();
          delete tmpl[id];
          // 把空出的份额按原占比分给剩余条目
          const ids = Object.keys(tmpl);
          if (ids.length === 0) return;
          let s = 0;
          for (const k of ids) s += (tmpl[k] || 0);
          if (s < 1e-6) {
            const each = 1.0 / ids.length;
            for (const k of ids) tmpl[k] = each;
          } else {
            const factor = 1.0 / s;
            for (const k of ids) tmpl[k] = Math.max(0, (tmpl[k] || 0) * factor);
          }
        },
        clearTroops() {
          if (!confirm(this.tr('清空全部已选兵种？', 'Clear all selected troops?'))) return;
          this.config.GlobalDefaults.ExactTroopTemplate = {};
          this.markDirty();
          this.log(this.tr('兵员模板已清空（未保存）', 'Troop template cleared (unsaved).'), 'ok');
        },
        // 修浮点漂移：通过调整除 lockedKey 外占比最大的条目，让 Σ 精确等于 1
        _snapTroopSumTo1(lockedKey) {
          const tmpl = this.config.GlobalDefaults.ExactTroopTemplate;
          const ids = Object.keys(tmpl);
          if (ids.length === 0) return;
          let total = 0;
          for (const k of ids) total += (tmpl[k] || 0);
          const drift = 1 - total;
          if (Math.abs(drift) < 1e-4) return;
          const others = ids.filter(k => k !== lockedKey);
          if (others.length === 0) {
            tmpl[lockedKey] = Math.max(0, Math.min(1, (tmpl[lockedKey] || 0) + drift));
            return;
          }
          let biggest = others[0];
          for (const k of others) if ((tmpl[k] || 0) > (tmpl[biggest] || 0)) biggest = k;
          tmpl[biggest] = Math.max(0, Math.min(1, (tmpl[biggest] || 0) + drift));
        },

        // ============ helpers ============
        // i18n: 双语字符串就地切换。zh = 简体中文,en = English。
        tr(zh, en) { return this.lang === 'zh' ? zh : en; },
        // 从 /api/status 的 uiLang 确定面板语言(以游戏语言为准),并刷新 <title> / <html lang>。
        applyLang() {
          const ul = this.status && this.status.uiLang;
          if (ul === 'zh' || ul === 'en') this.lang = ul;
          document.documentElement.lang = this.lang === 'zh' ? 'zh-CN' : 'en';
          document.title = this.tr('Sovereign Towns · 控制面板', 'Sovereign Towns · Control Panel');
        },
        ratioSumOk(sum) { return sum >= 0.9 && sum <= 1.1; },
        typeGlyph(type) {
          return ({ cavalry: '♞', horsearcher: '↝', infantry: '⚔', ranged: '⤧' })[type] || '·';
        },
        typeLabel(type) {
          return ({ cavalry: this.tr('骑兵', 'Cavalry'), horsearcher: this.tr('骑射', 'Horse archer'), infantry: this.tr('步兵', 'Infantry'), ranged: this.tr('远程', 'Ranged') })[type] || type || '';
        },
        cultureLabel(stringId) {
          // Look up the localized name from any dumped troop with that culture id;
          // fall back to the stringId itself if we somehow can't find one.
          if (!stringId) return '';
          for (const t of this.troops) {
            if (t.culture === stringId) return t.cultureName || stringId;
          }
          return stringId;
        },
        highlight(text, query) {
          if (!query) return this.escape(text);
          const q = query.toLowerCase();
          const lower = text.toLowerCase();
          const idx = lower.indexOf(q);
          if (idx < 0) return this.escape(text);
          return this.escape(text.slice(0, idx))
               + '<mark>' + this.escape(text.slice(idx, idx + q.length)) + '</mark>'
               + this.escape(text.slice(idx + q.length));
        },
        escape(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); },

        log(msg, cls = '') {
          this.logEntries.unshift({
            ts: new Date().toLocaleTimeString().slice(0,8) + ' ',
            msg,
            cls: cls === 'err' ? 'text-danger-500' : cls === 'ok' ? 'text-sage-400' : 'text-parchment-200',
          });
          while (this.logEntries.length > 20) this.logEntries.pop();
        },
      };
    }
  </script>
